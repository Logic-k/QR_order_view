<section class="mini-map-panel" aria-label="자리 배치도 / Seating map / 座位图">
  <div class="map-caption"><h2>내 자리 확인 <span>Find your seat · 座位图</span></h2><span class="map-key"><i></i>현재 자리</span></div>
  <div class="mini-map" role="img" aria-label="12, 11, 10, 9번은 세로 한 줄, 1부터 8번은 가로 한 줄. 현재 자리 {{ seat_number }}번. Seats 12 to 9 form one column; seats 1 to 8 form one row. Your seat is {{ seat_number }}.">
    <div class="mini-side">{% for n in range(12,8,-1) %}<span class="map-seat {% if seat_number == n|string %}current-seat{% endif %}" data-map-seat="{{ n }}" {% if seat_number == n|string %}aria-current="location"{% endif %}>{{ n }}</span>{% endfor %}</div>
    <div class="mini-main">{% for n in range(1,9) %}<span class="map-seat {% if seat_number == n|string %}current-seat{% endif %}" data-map-seat="{{ n }}" {% if seat_number == n|string %}aria-current="location"{% endif %}>{{ n }}</span>{% endfor %}</div>
    <p class="map-center-note">편안하게 쉬어가세요<span>Enjoy your break · 享受休闲时光</span></p>
  </div>
</section>
