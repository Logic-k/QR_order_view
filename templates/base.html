<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}QR 주문{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}"><script src="{{ url_for('static', filename='ui-map.js') }}" defer></script><script src="{{ url_for('static', filename='ui.js') }}" defer></script>{% block head %}{% endblock %}<link rel="stylesheet" href="{{ url_for('static', filename='overview.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='visible-orders.css') }}"></head>
