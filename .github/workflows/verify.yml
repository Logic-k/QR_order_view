name: QR verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  flask-and-gunicorn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Flask and SQLite regressions
        run: python -m pytest tests -q
      - name: Real Gunicorn smoke with synthetic SQLite
        shell: bash
        env:
          QR_ADMIN_USER: synthetic-ci-staff
          QR_ADMIN_PASSWORD: synthetic-ci-password-never-production
          FLASK_DEBUG: '0'
        run: |
          set -euo pipefail
          qr_directory="$(mktemp -d "$RUNNER_TEMP/qr-ci-XXXXXX")"
          export QR_DATABASE_PATH="$qr_directory/synthetic.db"
          gunicorn -w 1 -b 127.0.0.1:5187 app:app >"$qr_directory/server.log" 2>&1 &
          qr_server_pid=$!
          trap 'kill "$qr_server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 -sS 'http://127.0.0.1:5187/order?seat=7' >"$qr_directory/order.html"
          test "$(curl -sS -o "$qr_directory/denied.json" -w '%{http_code}' http://127.0.0.1:5187/admin)" = 401
          curl --fail -sS -u "$QR_ADMIN_USER:$QR_ADMIN_PASSWORD" http://127.0.0.1:5187/admin >"$qr_directory/admin.html"
          test "$(curl -sS -o "$qr_directory/csrf.json" -w '%{http_code}' -u "$QR_ADMIN_USER:$QR_ADMIN_PASSWORD" -X POST http://127.0.0.1:5187/delete-all-orders)" = 403
          curl --fail -sS -H 'Content-Type: application/json' -d '{"drink":"아메리카노(HOT)"}' 'http://127.0.0.1:5187/order?seat=7' >"$qr_directory/customer.json"
          qr_csrf_token="$(python -c 'import re,sys; from pathlib import Path; print(re.search(r"name=\"csrf-token\" content=\"([^\"]+)\"", Path(sys.argv[1]).read_text()).group(1))' "$qr_directory/admin.html")"
          curl --fail -sS -u "$QR_ADMIN_USER:$QR_ADMIN_PASSWORD" -H 'Content-Type: application/json' -H "X-CSRF-Token: $qr_csrf_token" -d '{"seat":"8","drink":"캐모마일(HOT)"}' http://127.0.0.1:5187/master-order >"$qr_directory/staff.json"
          python db_tools.py backup "$QR_DATABASE_PATH" "$qr_directory/backup.db"
          python db_tools.py restore "$qr_directory/backup.db" "$qr_directory/restored.db"
          python db_tools.py verify "$qr_directory/restored.db"
